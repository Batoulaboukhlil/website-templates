<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Minimal Clean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8 border border-gray-100">
    <div class="text-center mb-8">
        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3">
            <i class="fas fa-bolt text-xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-900">Sign In</h2>
        <p class="text-gray-500 text-sm mt-1">Welcome back! Please enter your details</p>
    </div>

    <!-- Social Logins -->
    <div class="grid grid-cols-2 gap-3 mb-6">
        <button class="flex items-center justify-center gap-2 py-2.5 border border-gray-200 rounded-xl hover:bg-gray-50 text-gray-700 text-sm font-medium transition-all">
            <i class="fab fa-google text-red-500"></i> Google
        </button>
        <button class="flex items-center justify-center gap-2 py-2.5 border border-gray-200 rounded-xl hover:bg-gray-50 text-gray-700 text-sm font-medium transition-all">
            <i class="fab fa-github text-gray-900"></i> GitHub
        </button>
    </div>

    <div class="relative flex items-center justify-center mb-6">
        <div class="border-t border-gray-200 w-full"></div>
        <span class="bg-white px-3 text-xs text-gray-400 absolute">Or continue with</span>
    </div>

    <form class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Username / Email</label>
            <input type="text" placeholder="name@domain.com" class="w-full px-4 py-3 rounded-xl border border-gray-200 text-gray-800 text-sm focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 transition-all">
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Password</label>
            <input type="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-200 text-gray-800 text-sm focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 transition-all">
        </div>

        <button type="button" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-md shadow-indigo-200 transition-all">
            Sign In
        </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
        Don't have an account? <a href="#" class="text-indigo-600 font-semibold hover:underline">Sign up</a>
    </p>
</div>

</body>
</html>
