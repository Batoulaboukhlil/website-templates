<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Soft UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-white rounded-3xl p-8 shadow-xl border border-blue-100">
    <div class="flex items-center justify-between mb-8">
        <div>
            <h2 class="text-2xl font-black text-blue-900">Join Us</h2>
            <p class="text-blue-500 text-xs mt-1">Start your journey in a few simple steps</p>
        </div>
        <div class="w-10 h-10 bg-blue-100 rounded-2xl flex items-center justify-center text-blue-600 font-bold">
            <i class="fas fa-user-plus"></i>
        </div>
    </div>

    <form class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-blue-900 mb-1">Full Name</label>
            <div class="relative">
                <i class="far fa-user absolute left-3 top-3.5 text-blue-400 text-sm"></i>
                <input type="text" placeholder="Batoul Aboukhlil" class="w-full pl-9 pr-4 py-2.5 bg-blue-50/50 border border-blue-100 rounded-xl text-gray-800 text-sm focus:outline-none focus:border-blue-500 transition-all">
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold text-blue-900 mb-1">Email Address</label>
            <div class="relative">
                <i class="far fa-envelope absolute left-3 top-3.5 text-blue-400 text-sm"></i>
                <input type="email" placeholder="example@domain.com" class="w-full pl-9 pr-4 py-2.5 bg-blue-50/50 border border-blue-100 rounded-xl text-gray-800 text-sm focus:outline-none focus:border-blue-500 transition-all">
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold text-blue-900 mb-1">Password</label>
            <div class="relative">
                <i class="fas fa-shield-alt absolute left-3 top-3.5 text-blue-400 text-sm"></i>
                <input type="password" placeholder="••••••••" class="w-full pl-9 pr-4 py-2.5 bg-blue-50/50 border border-blue-100 rounded-xl text-gray-800 text-sm focus:outline-none focus:border-blue-500 transition-all">
            </div>
        </div>

        <button type="button" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 transition-all">
            Register for Free
        </button>
    </form>

    <div class="mt-6 pt-6 border-t border-gray-100 text-center">
        <p class="text-xs text-gray-500">
            Already have an account? <a href="#" class="text-blue-600 font-bold hover:underline">Log in</a>
        </p>
    </div>
</div>

</body>
</html>
