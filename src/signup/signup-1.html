<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Dark Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-lg bg-gray-800 rounded-3xl shadow-2xl p-8 border border-gray-700">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-white">Create Account</h2>
        <p class="text-gray-400 text-sm mt-1">Join our creative community today</p>
    </div>

    <form class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">First Name</label>
                <input type="text" placeholder="Batoul" class="w-full px-4 py-2.5 rounded-xl bg-gray-900 border border-gray-700 text-white text-sm focus:border-emerald-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">Last Name</label>
                <input type="text" placeholder="Aboukhlil" class="w-full px-4 py-2.5 rounded-xl bg-gray-900 border border-gray-700 text-white text-sm focus:border-emerald-500 focus:outline-none">
            </div>
        </div>

        <div>
            <label class="block text-xs font-medium text-gray-300 mb-1">Email Address</label>
            <input type="email" placeholder="batoul@example.com" class="w-full px-4 py-2.5 rounded-xl bg-gray-900 border border-gray-700 text-white text-sm focus:border-emerald-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-xs font-medium text-gray-300 mb-1">Password</label>
            <input type="password" placeholder="8+ characters" class="w-full px-4 py-2.5 rounded-xl bg-gray-900 border border-gray-700 text-white text-sm focus:border-emerald-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-xs font-medium text-gray-300 mb-1">Confirm Password</label>
            <input type="password" placeholder="Re-enter password" class="w-full px-4 py-2.5 rounded-xl bg-gray-900 border border-gray-700 text-white text-sm focus:border-emerald-500 focus:outline-none">
        </div>

        <div class="flex items-center gap-2 mt-2">
            <input type="checkbox" id="terms" class="rounded bg-gray-900 border-gray-700 text-emerald-500 focus:ring-emerald-500">
            <label for="terms" class="text-xs text-gray-400">I agree to the <a href="#" class="text-emerald-400 underline">Terms and Conditions</a></label>
        </div>

        <button type="button" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-bold rounded-xl transition-all shadow-lg shadow-emerald-500/20 mt-4">
            Create Account
        </button>
    </form>

    <div class="mt-6 text-center text-xs text-gray-400">
        Already have an account? <a href="#" class="text-emerald-400 font-semibold hover:underline">Log in</a>
    </div>
</div>

</body>
</html>
